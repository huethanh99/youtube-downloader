name: Build macOS App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller yt-dlp

      - name: Download FFmpeg for macOS
        run: |
          mkdir -p bin
          curl -L -o ffmpeg.zip https://github.com/ffbinaries/ffbinaries-prebuilt/releases/download/v4.4.1/ffmpeg-4.4.1-osx-64.zip
          unzip ffmpeg.zip -d bin/
          chmod +x bin/ffmpeg
          rm ffmpeg.zip

      - name: Convert Icon to macOS format
        run: |
          sips -s format icns devscripts/logo.ico --out devscripts/logo.icns

      - name: Build with PyInstaller
        run: |
          pyinstaller --name "Youtube-Downloader" --windowed --noconfirm --icon devscripts/logo.icns --add-data "bin/ffmpeg:bin" app_gui.py

      - name: Zip the macOS App bundle
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/Youtube-Downloader.app" "dist/Youtube-Downloader-Mac.zip"

      - name: Upload to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 "dist/Youtube-Downloader-Mac.zip" --clobber
