name: Build Windows App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller yt-dlp

      - name: Download FFmpeg for Windows
        run: |
          mkdir bin
          curl -L -o ffmpeg.zip https://github.com/ffbinaries/ffbinaries-prebuilt/releases/download/v4.4.1/ffmpeg-4.4.1-win-64.zip
          unzip ffmpeg.zip -d bin/
          rm ffmpeg.zip
        shell: bash

      - name: Build Core App with PyInstaller
        run: pyinstaller youtube-downloader.spec

      - name: Build Setup Installer with PyInstaller
        run: pyinstaller youtube-downloader-setup.spec

      - name: Upload to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 "dist/youtube-downloader-setup.exe" --clobber
        shell: bash
